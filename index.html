<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Suresh Live Medias offers photography, videography, drone coverage, LED screens, live streaming, mixing and JBL sound in Bhimavaram.">
    <meta property="og:title" content="Suresh Live Medias | Studio & Event Production">
    <meta property="og:description" content="Photography, film and live event production in Bhimavaram.">
    <meta property="og:type" content="website">
    <script>
      (() => {
        const root = document.documentElement;
        let saved;
        try { saved = localStorage.getItem('slm-theme'); } catch {}
        if (saved === 'light' || saved === 'dark') root.dataset.themePreference = saved;
        root.dataset.theme = root.dataset.themePreference
          || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      })();
    </script>
    <link rel="preload" as="image" href="/media/production.webp">
    <link rel="icon" href="/media/icon.webp" type="image/webp">
    <title>Suresh Live Medias | Studio &amp; Event Production</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
